<div class="p-4">
  <h2 class="text-lg font-semibold mb-2">Registros Contables Guardados</h2>

  <table class="border-collapse w-full border">
    <thead class="bg-gray-100">
      <tr>
        <th class="border p-2">#</th>
        <th class="border p-2">Fecha</th>
        <th class="border p-2">Tipo</th>
        <th class="border p-2">Número</th>
        <th class="border p-2">Tercero</th>
        <th class="border p-2">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of registros$ | async">
        <td class="border p-2">{{ r.id }}</td>
        <td class="border p-2">{{ r.fecha | date }}</td>
        <td class="border p-2">{{ r.tipoDocumento }}</td>
        <td class="border p-2">{{ r.numero }}</td>
        <td class="border p-2">{{ r.terceroPrincipal.nombre }}</td>
        <td class="border p-2">
          <button (click)="r.id && eliminar(r.id)" class="text-red-500">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
